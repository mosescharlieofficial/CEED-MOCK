<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mock Test Portal – CEED | UCEED | NID | NIFT | NATA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .header-title i {
            font-size: 2rem;
        }
        .subhead {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 8px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 25px;
            flex: 1;
        }

        .filter-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            margin-bottom: 30px;
        }

        .filter-group {
            margin-bottom: 25px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 12px;
            background: #f9f9f9;
            transition: 0.2s;
        }
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }

        .start-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .start-btn:hover {
            background: #219150;
            transform: scale(1.02);
        }

        .info-note {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-size: 0.85rem;
            color: #2c3e50;
        }

        .footer {
            background: #2c3e50;
            color: #b0c4de;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .filter-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-title">
        <div><i class="fas fa-graduation-cap"></i> Online Coaching Center</div>
    </div>
    <div class="subhead">Select your exam & year – start a fully protected mock test</div>
</header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label><i class="fas fa-building"></i> Exam Type</label>
            <select id="examType">
                <option value="CEED">CEED (Common Entrance Exam for Design)</option>
                <option value="UCEED">UCEED (Undergraduate CEED)</option>
                <option value="NID">NID (National Institute of Design)</option>
                <option value="NIFT">NIFT (National Institute of Fashion Technology)</option>
                <option value="NATA">NATA (National Aptitude Test in Architecture)</option>
            </select>
        </div>

        <div class="filter-group">
            <label><i class="fas fa-calendar-alt"></i> Previous Year Paper</label>
            <select id="yearSelect">
                <!-- dynamically populated -->
            </select>
        </div>

        <button class="start-btn" id="startTestBtn">
            <i class="fas fa-play"></i> Start Mock Test
        </button>
        <div class="info-note" style="margin-top: 20px;">
            <i class="fas fa-shield-alt"></i> Anti‑cheat enabled • Auto‑submit on timer end • Scoring as per official key
        </div>
    </div>
</div>

<footer class="footer">
    <i class="fas fa-sync-alt"></i> Powered by Moses Charlie
</footer>

<script>
    // Available years for each exam
    const examData = {
        CEED: [2025],
        UCEED: [],
        NID: [],
        NIFT: [],
        NATA: []
    };

    const examTypeSelect = document.getElementById('examType');
    const yearSelect = document.getElementById('yearSelect');
    const startBtn = document.getElementById('startTestBtn');

    function populateYears() {
        const selectedExam = examTypeSelect.value;
        const years = examData[selectedExam] || [];
        yearSelect.innerHTML = '';
        years.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
        });
        if (years.length === 0) {
            const option = document.createElement('option');
            option.textContent = 'No papers available';
            yearSelect.appendChild(option);
        }
    }

    examTypeSelect.addEventListener('change', populateYears);
    populateYears(); // initial load

    startBtn.addEventListener('click', () => {
        const exam = examTypeSelect.value;
        const year = yearSelect.value;

        if (!year) {
            alert('Please select a valid year.');
            return;
        }

        // Build filename: e.g., "CEED2025.html"
        const fileName = `${exam}${year}.html`;
        
        if (confirm(`Start ${exam} ${year} mock test?\n\nAnti-cheat protections will be active.`)) {
            window.location.href = fileName;
        }
    });
</script>
</body>
</html>
